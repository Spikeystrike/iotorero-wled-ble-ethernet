name: Build WLED IoTorero BLE Ethernet candidates (does not flash)
on:
  workflow_dispatch:
  push:
    paths:
      - build_iotorero.py
      - board_profile.json
      - .github/workflows/build.yml
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Offline self-test
        run: python build_iotorero.py --self-test
      - name: Build audio and non-audio candidates
        run: python build_iotorero.py --profile both
      - name: Upload UNTESTED candidates
        uses: actions/upload-artifact@v4
        with:
          name: iotorero-ble-ethernet-untested
          path: dist/*
          if-no-files-found: error
